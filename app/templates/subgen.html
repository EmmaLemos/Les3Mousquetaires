<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renaissance Media Uploader</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/style.css" />
<body>
    <header>Générateur de sous-titres</header>
    <div class="background-video">
        <video autoplay loop muted playsinline>
            <source src="static/bg.mp4" type="video/mp4">
            Votre navigateur ne supporte pas les vidéos HTML5.
        </video>
    </div>
    <div class="container">
        
        
        <p><em>"L'art de la vision et du son réunis en une seule expérience, le texte."</em></p>
        
        <div class="upload-box">
            <label for="file-upload" class="upload-label">Cliquez ici pour télécharger une vidéo ou un son</label>
            <input type="file" id="file-upload" accept="video/*,audio/*" onchange="previewFile()">
        </div>
        
        <div class="preview-container" id="preview-container">
            <p><strong>Fichier sélectionné :</strong> <span id="file-name"></span></p>
            <div id="preview-media"></div>
        </div>

        <form id="media-form" class="form-upload">
            <label for="choice-select">Choisissez une option :</label>
            <select class="choice-select" id="choice-select" name="media-choice">
                <option value="video_with_sub">Video avec sous-titres</label>
                <option value="video_and_sub">Video & sous-titres à part</option>
                <option value="sub_only">Sous-titres seuls</option>
                <option value="text_only">Texte uniquement</option>
            </select>
    
            <label>
                <input type="checkbox" id="translation-checkbox">
                Activer la traduction
            </label>
    
            <button class="button" type="button" onclick="uploadMedia()">Envoyer au serveur</button>
        </form>

        <button class="button" type="button" onclick="downloadFile()" class="download-button">Télécharger le fichier</button>
        
        <div class="status-message" id="status-message"></div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <script>
        const { createFFmpeg, fetchFile } = FFmpeg;
        const ffmpeg = createFFmpeg({ log: true });

        function previewFile() {
            const fileInput = document.getElementById('file-upload');
            const file = fileInput.files[0];
            const fileName = document.getElementById('file-name');
            const previewContainer = document.getElementById('preview-container');
            const previewMedia = document.getElementById('preview-media');

            if (!file) {
                previewContainer.style.display = "none";
                return;
            }

            fileName.textContent = file.name;
            previewContainer.style.display = "block";

            // Clear previous preview
            previewMedia.innerHTML = "";

            // Check if it's video or audio
            if (file.type.startsWith("video/")) {
                const videoElement = document.createElement("video");
                videoElement.setAttribute("controls", "true");
                videoElement.setAttribute("width", "100%");
                const objectURL = URL.createObjectURL(file);
                videoElement.src = objectURL;
                previewMedia.appendChild(videoElement);
            } else if (file.type.startsWith("audio/")) {
                const audioElement = document.createElement("audio");
                audioElement.setAttribute("controls", "true");
                const objectURL = URL.createObjectURL(file);
                audioElement.src = objectURL;
                previewMedia.appendChild(audioElement);
            }
        }

        function readFileAsBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]); // Enlever le préfixe "data:..."
                reader.onerror = () => reject(reader.error);
                reader.readAsDataURL(file);
            });
        }

        async function extractAudio(videoFile) {
            if (!ffmpeg.isLoaded()) {
                await ffmpeg.load();
            }
            ffmpeg.FS('writeFile', 'input.mp4', await fetchFile(videoFile));
            
            // Extract audio as mp3
            await ffmpeg.run('-i', 'input.mp4', '-q:a', '0', '-map', 'a', 'output.mp3');
            
            const audioData = ffmpeg.FS('readFile', 'output.mp3');

            // Create audio URL
            const audioBlob = new Blob([audioData.buffer], { type: 'audio/mp3' });
            const audioURL = URL.createObjectURL(audioBlob);

            // Return the audio
            const audio = new Audio(audioURL);
            return audio
        }

        async function audioUrlToFile(url, filename) {
            const response = await fetch(url);
            const blob = await response.blob();
            return new File([blob], filename, { type: blob.type });
        }

        async function getFileData() {
            const fileInput = document.getElementById('file-upload');
            const file = fileInput.files[0];
            
            if (!file) {
                alert("Veuillez sélectionner un fichier à envoyer.");
                return;
            }

            var audioFile = file
            if (file.type.includes("video")) {
                const audioBlob = await extractAudio(file)
                audioFile = await audioUrlToFile(
                    audioBlob.src, "output.mp3"
                )
            }

            const fileData = await readFileAsBase64(audioFile);

            return fileData
        }

        async function uploadMedia() {
            const translate = document.getElementById('translation-checkbox').checked;

            const statusMessage = document.getElementById('status-message');

            const fileData = await getFileData();

            const payload = {
                translate: translate,
                data: fileData  // Envoi des données en Base64
            };

            fetch("/upload", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
            })
            .then(response => response.json())
            .then(data => {
                localStorage.setItem("subtitleFile", data.subtitles);
                statusMessage.innerHTML = "Fichier traité avec succès!";
            })
            .catch(error => {
                statusMessage.innerHTML = "Erreur lors de l'envoi du fichier.";
            });
        }

        function parseSrtText(srtContent) {
            // Split the content by lines
            const lines = srtContent.split(/\r?\n/);

            const textLines = [];
            let buffer = '';

            lines.forEach(line => {
                line = line.trim();

                if (!line) {
                    // Empty line indicates end of subtitle block
                    if (buffer) {
                        textLines.push(buffer.trim());
                        buffer = '';
                    }
                } else if (!line.match(/^\d+$/) && !line.includes('-->')) {
                    // Ignore line numbers and timestamps
                    buffer += line + ' ';
                }
            });

            // Catch any remaining buffer
            if (buffer) {
                textLines.push(buffer.trim());
            }

            // Join all text lines into a single string
            return textLines.join(' ');
        }

        async function embedSubtitles(videoFile, srtContent, outputFilename = "output.mp4") {
            if (!ffmpeg.isLoaded()) await ffmpeg.load();

            // Load input video
            ffmpeg.FS('writeFile', 'input.mp4', await fetchFile(videoFile));

            // Load subtitles
            const srtBlob = new Blob([srtContent], { type: 'text/plain;charset=utf-8' });
            const srtBuffer = await srtBlob.arrayBuffer();
            ffmpeg.FS('writeFile', 'subtitles.srt', new Uint8Array(srtBuffer));

            // Run optimized ffmpeg command (fast preset, lower resolution, lower bitrate)
            await ffmpeg.run(
                '-i', 'input.mp4',
                '-vf', 'subtitles=subtitles.srt',
                '-preset', 'ultrafast',
                '-crf', '30',
                'output.mp4'
            );

            // Retrieve the output file
            const data = ffmpeg.FS('readFile', 'output.mp4');

            const videoBlob = new Blob([data.buffer], { type: 'video/mp4' });
            return videoBlob
        }


        function downloadSubtitlesAsText() {
            const storedSrt = localStorage.getItem("subtitleFile");
            const link = document.createElement('a');
            const srtText = parseSrtText(storedSrt)
            const blob = new Blob([srtText], { type: "text/plain;charset=utf-8" })
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.download = "subtitles.txt"
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        function downloadSubtitles() {
            const storedSrt = localStorage.getItem("subtitleFile");
            const link = document.createElement('a');
            const blob = new Blob([storedSrt], { type: "text/plain;charset=utf-8" })
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.download = "subtitles.srt"
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        async function downloadVideoWithSubs() {
            const storedSrt = localStorage.getItem("subtitleFile");
            const link = document.createElement('a');
            const fileInput = document.getElementById('file-upload');
            const file = fileInput.files[0];
            if (file.type.includes("video")) {
                const blob = await embedSubtitles(file, storedSrt)
                link.download = "output.mp4"
                const url = URL.createObjectURL(blob);
                link.href = url;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            }
        }

        async function downloadFile() {
            const choice = document.getElementById('choice-select').value;

            if (choice === "text_only") {
                downloadSubtitlesAsText()
            } else if (choice === "sub_only") {
                downloadSubtitles()
            } else if (choice === "video_and_sub") {
                await downloadVideoWithSubs()
                downloadSubtitles()
            } else if (choice === "video_with_sub") {
                await downloadVideoWithSubs()
            }
        }
    </script>
</body>
</html>
